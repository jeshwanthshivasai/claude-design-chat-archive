<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design Chat Archive</title>
<style>
  body {
    margin: 0; width: 280px; background: #EAD9AE; color: #1E2A4A;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  h1 { margin: 0; font: 600 17px/1.2 Charter, "Iowan Old Style", Georgia, serif; }
  p { margin: 0; color: #4F5A78; }
  button {
    border: 0; border-radius: 4px; background: #1E2A4A; color: #FBF6E9;
    padding: 9px 12px; font: 600 13px/1 inherit; font-family: inherit; cursor: pointer;
  }
  button:hover { background: #2B3A63; }
  button:focus-visible { outline: 2px solid #1E2A4A; outline-offset: 2px; }
  small { color: #4F5A78; font-size: 11.5px; }
</style>
</head>
<body>
<main>
  <h1>Design Chat Archive</h1>
  <p>Open Claude Design, then click the <strong>Export chats</strong> tab on the right edge of the page.</p>
  <button id="open">Open Claude Design</button>
  <small>Unofficial. Runs only in your browser, using your own sign-in.</small>
</main>
<script src="popup.js"></script>
</body>
</html>
